name: run-tests
on: [ push, workflow_dispatch ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        stability: [prefer-lowest, prefer-stable]
        dependencies:
          - php: 8.2
            laravel: ~12.60
            testbench: ~10.5
            pest: 3.*
          - php: 8.3
            laravel: ~12.60
            testbench: ~10.5
            pest: 4.*
          - php: 8.4
            laravel: ~12.60
            testbench: ~10.5
            pest: 4.*
          - php: 8.3
            laravel: ~13.0
            testbench: ~11.0
            pest: 4.*
          - php: 8.4
            laravel: ~13.0
            testbench: ~11.0
            pest: 4.*
          - php: 8.5
            laravel: ~13.0
            testbench: ~11.0
            pest: 4.*

    name: P${{ matrix.dependencies.php }} - L${{ matrix.dependencies.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.dependencies.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.dependencies.laravel }}" "orchestra/testbench:${{ matrix.dependencies.testbench }}" "pestphp/pest:${{ matrix.dependencies.pest }}" --no-interaction --no-update --dev
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci
